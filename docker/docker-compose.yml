# Docker Compose — Base (shared across all platforms)
# Override with docker/docker-compose.jetson.yml or docker/docker-compose.windows.yml

services:
  gesture:
    container_name: gesture
    build:
      context: ..
      dockerfile: docker/Dockerfile.${ARCH:-amd64}
    image: gesture:${ARCH:-amd64}
    ports:
      - "${FLASK_PORT:-5000}:${FLASK_PORT:-5000}"
      - "${FRONTEND_PORT:-8000}:${FRONTEND_PORT:-8000}"
    env_file:
      - ../.env
    stdin_open: true
    tty: true
